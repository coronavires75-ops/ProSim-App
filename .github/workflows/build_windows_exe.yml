name: Build Public ProSim.exe Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask numpy pyinstaller
      - name: Build ProSim.exe
        run: |
          pyinstaller --onefile --noconsole --add-data "templates;templates" --add-data "static;static" --name "ProSim" run_local.py
      - name: Publish Release with ProSim.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-desktop
          name: ProSim Desktop v1.0 (Windows)
          files: dist/ProSim.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
