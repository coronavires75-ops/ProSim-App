name: Build Windows ProSim.exe
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask numpy pyinstaller
      - name: Build ProSim.exe
        run: |
          pyinstaller --onefile --noconsole --add-data "templates;templates" --add-data "static;static" --name "ProSim" run_local.py
      - name: Upload ProSim.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProSim-Windows-Executable
          path: dist/ProSim.exe
