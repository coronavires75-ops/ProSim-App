name: Build Multi-Platform Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview pillow
          python -c "from PIL import Image; Image.open('static/app_icon.png').save('static/app_icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32)])"
          pyinstaller --noconfirm --clean --windowed --name ProSimUltimate --onefile --icon=static/app_icon.ico --add-data "templates;templates" --add-data "static;static" desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Windows-EXE
          path: dist/ProSimUltimate.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Android APK with Custom Icon
        run: |
          mkdir -p android_app/app/src/main/java/org/prosim/isis
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android_app/app/src/main/res/mipmap-$d
            cp static/app_icon.png android_app/app/src/main/res/mipmap-$d/ic_launcher.png
            cp static/app_icon.png android_app/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

          cat << 'INNER' > android_app/settings.gradle
          rootProject.name = "ProSimUltimate"
          include ':app'
          INNER

          cat << 'INNER' > android_app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          INNER

          cat << 'INNER' > android_app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'org.prosim.isis'
              compileSdk 34
              defaultConfig {
                  applicationId "org.prosim.isis"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          INNER

          cat << 'INNER' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="ProSim Ultimate"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          INNER

          cat << 'INNER' > android_app/app/src/main/java/org/prosim/isis/MainActivity.java
          package org.prosim.isis;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("http://127.0.0.1:5000");
                  setContentView(webView);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          INNER

          cd android_app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Android-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package iOS App Bundle
        run: |
          mkdir -p ProSimUltimate-iOS-App
          cp -r app.py solver.py main.py templates static manifest.webmanifest service-worker.js requirements.txt Procfile ProSimUltimate-iOS-App/
          zip -r ProSimUltimate-iOS-Bundle.zip ProSimUltimate-iOS-App
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-iOS-Bundle
          path: ProSimUltimate-iOS-Bundle.zip
