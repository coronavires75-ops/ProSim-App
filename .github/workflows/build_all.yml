name: Build Multi-Platform Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview pillow
          python -c "from PIL import Image; Image.open('static/app_icon.png').save('static/app_icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32)])"
          pyinstaller --noconfirm --clean --windowed --name ProSimUltimate --onefile --icon=static/app_icon.ico --add-data "templates;templates" --add-data "static;static" desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Windows-EXE
          path: dist/ProSimUltimate.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Self-Contained Offline Android APK (Embedded Python + Signed)
        env:
          VER_CODE: ${{ github.run_number }}
        run: |
          mkdir -p android_app/app/src/main/java/org/prosim/isis
          mkdir -p android_app/app/src/main/python
          cp -r app.py solver.py models.py parts_db.py run_local.py templates static manifest.webmanifest service-worker.js android_app/app/src/main/python/

          keytool -genkeypair -noprompt -keystore android_app/prosim_release.jks -alias prosim_key -keyalg RSA -keysize 2048 -validity 10000 -storepass prosim123456 -keypass prosim123456 -dname "CN=ProSim, OU=Electronics, O=ProSim, L=Cairo, S=Cairo, C=EG"

          cat << 'INNER' > android_app/app/src/main/python/android_server.py
          import threading, time, socket
          from app import app

          _port = None

          def start():
              global _port
              if _port is not None:
                  return _port
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.bind(('127.0.0.1', 0))
                  _port = s.getsockname()[1]
              t = threading.Thread(
                  target=lambda: app.run(host='127.0.0.1', port=_port, debug=False, use_reloader=False, threaded=True),
                  daemon=True
              )
              t.start()
              time.sleep(0.8)
              return _port
          INNER

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android_app/app/src/main/res/mipmap-$d
            cp static/app_icon.png android_app/app/src/main/res/mipmap-$d/ic_launcher.png
            cp static/app_icon.png android_app/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

          cat << 'INNER' > android_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          rootProject.name = "ProSimUltimate"
          include ':app'
          INNER

          cat << 'INNER' > android_app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'com.chaquo.python' version '15.0.1' apply false
          }
          INNER

          cat << 'INNER' > android_app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }
          android {
              namespace 'org.prosim.isis'
              compileSdk 34
              defaultConfig {
                  applicationId = "org.prosim.isis"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = (System.getenv("VER_CODE") ?: "1").toInteger() + 10
                  versionName = "2." + (System.getenv("VER_CODE") ?: "1")
                  ndk {
                      abiFilters.addAll(["arm64-v8a", "armeabi-v7a"])
                  }
              }
              signingConfigs {
                  release {
                      storeFile file("../prosim_release.jks")
                      storePassword "prosim123456"
                      keyAlias "prosim_key"
                      keyPassword "prosim123456"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          chaquopy {
              defaultConfig {
                  version "3.11"
                  pip {
                        install "Flask>=3.0,<4.0"
                        install "numpy>=2.0,<3.0"
                  }
              }
          }
          dependencies {}
          INNER

          cat << 'INNER' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="ProSim Ultimate"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          INNER

          cat << 'INNER' > android_app/app/src/main/java/org/prosim/isis/MainActivity.java
          package org.prosim.isis;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import com.chaquo.python.PyObject;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#0f172a"));

                  TextView loading = new TextView(this);
                  loading.setText("Starting ProSim SPICE Engine...");
                  loading.setTextColor(Color.WHITE);
                  loading.setTextSize(18f);
                  loading.setGravity(Gravity.CENTER);
                  root.addView(loading);
                  setContentView(root);

                  new Thread(() -> {
                      if (!Python.isStarted()) {
                          Python.start(new AndroidPlatform(this));
                      }
                      Python py = Python.getInstance();
                      PyObject srv = py.getModule("android_server");
                      int port = srv.callAttr("start").toInt();
                      String url = "http://127.0.0.1:" + port;

                      runOnUiThread(() -> {
                          webView = new WebView(this);
                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setAllowFileAccess(true);
                          webView.setWebViewClient(new WebViewClient());
                          root.removeAllViews();
                          root.addView(webView);
                          webView.loadUrl(url);
                      });
                  }).start();
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          INNER

          # تحميل Gradle 8.5 الرسمي مباشرة وتثبيت الـ Wrapper به
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle-8.5.zip
          unzip -q /tmp/gradle-8.5.zip -d /tmp/
          cd android_app
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed Offline Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Android-APK
          path: android_app/app/build/outputs/apk/release/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package iOS App Bundle
        run: |
          mkdir -p ProSimUltimate-iOS-App
          cp -r app.py solver.py models.py parts_db.py main.py run_local.py templates static manifest.webmanifest service-worker.js requirements.txt Procfile ProSimUltimate-iOS-App/
          zip -r ProSimUltimate-iOS-Bundle.zip ProSimUltimate-iOS-App
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-iOS-Bundle
          path: ProSimUltimate-iOS-Bundle.zip
