name: Build Multi-Platform Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
          pyinstaller --noconfirm --clean --windowed --name ProSimUltimate --onefile --add-data "templates;templates" --add-data "static;static" desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Windows-EXE
          path: dist/ProSimUltimate.exe

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: Build Android APK
        run: |
          yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Android-APK
          path: bin/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare iOS Project
        run: |
          brew install autoconf automake libtool pkg-config || true
          pip install --upgrade pip kivy-ios
          toolchain build python3 kivy flask
          toolchain create ProSimUltimate .
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-iOS-XcodeProject
          path: ProSimUltimate-ios/
