name: Build Multi-Platform Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
          pyinstaller --noconfirm --clean --windowed --name ProSimUltimate --onefile --add-data "templates;templates" --add-data "static;static" desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Windows-EXE
          path: dist/ProSimUltimate.exe

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip setuptools wheel packaging
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv
      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-Android-APK
          path: bin/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package iOS App Bundle
        run: |
          mkdir -p ProSimUltimate-iOS-App
          cp -r app.py solver.py main.py templates static manifest.webmanifest service-worker.js requirements.txt Procfile ProSimUltimate-iOS-App/
          zip -r ProSimUltimate-iOS-Bundle.zip ProSimUltimate-iOS-App
      - uses: actions/upload-artifact@v4
        with:
          name: ProSimUltimate-iOS-Bundle
          path: ProSimUltimate-iOS-Bundle.zip
