<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ProSim Studio — Proteus Edition</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111827;
    --border: #1e293b;
    --accent: #0ea5e9;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }

  /* Top Clean Header */
  .topbar {
    height: 50px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; gap: 8px; z-index: 20;
  }
  .brand { font-weight: 800; color: var(--accent); font-size: 0.95rem; white-space: nowrap; }
  .top-actions { display: flex; gap: 6px; overflow-x: auto; align-items: center; }
  .btn {
    background: #1e293b; color: var(--text); border: 1px solid #334155;
    padding: 6px 11px; border-radius: 8px; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn:active { transform: scale(0.96); }
  .btn.active { background: var(--accent); border-color: #38bdf8; color: #fff; }
  .btn-lib { background: #b45309; border-color: #f59e0b; }
  .btn-run { background: #059669; border-color: #10b981; }
  .btn-scope { background: #0284c7; border-color: #38bdf8; }
  .btn-danger { background: #991b1b; border-color: #ef4444; }

  /* Main Schematic Workspace */
  .workspace { position: relative; flex: 1; overflow: hidden; background: #060a14; }
  canvas#board { width: 100%; height: 100%; display: block; touch-action: none; }

  /* Floating Zoom & Quick Controls */
  .zoom-pad {
    position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10;
  }
  .zoom-pad .btn { width: 38px; height: 38px; justify-content: center; font-size: 1.1rem; padding: 0; background: rgba(17,24,39,0.9); }

  /* Floating Status Pill */
  .status-pill {
    position: absolute; top: 12px; right: 12px; background: rgba(17,24,39,0.9);
    border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px;
    font-size: 0.74rem; color: var(--green); z-index: 10; pointer-events: none;
  }

  /* Bottom Toolbar (Tools) */
  .bottom-bar {
    height: 54px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    overflow-x: auto; z-index: 20;
  }

  /* Contextual Component Properties Sheet */
  .prop-sheet {
    position: absolute; bottom: 62px; left: 10px; right: 10px; max-width: 520px; margin: 0 auto;
    background: rgba(17,24,39,0.97); border: 1px solid var(--accent); border-radius: 12px;
    padding: 12px; z-index: 25; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
  }
  .prop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; color: var(--accent); font-size: 0.85rem; }
  .prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prop-grid label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; }
  .prop-grid input, .prop-grid select, textarea {
    width: 100%; background: #060a14; border: 1px solid #334155; color: #fff;
    padding: 6px 8px; border-radius: 6px; font-size: 0.85rem; user-select: text;
  }

  /* Modals (Library & Proteus Oscilloscope) */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(2,6,23,0.88);
    z-index: 50; justify-content: center; align-items: center; padding: 10px;
  }
  .modal-card {
    background: var(--panel); border: 1px solid #334155; border-radius: 14px;
    width: 100%; max-width: 860px; max-height: 92dvh; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.7);
  }
  .modal-head {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-body { padding: 12px; overflow-y: auto; flex: 1; }

  /* Library List */
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .lib-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 8px;
  }
  .lib-item:hover { background: #1e293b; }

  /* Authentic Proteus Oscilloscope Styling */
  .scope-screen-wrap {
    background: #020804; border: 2px solid #1e293b; border-radius: 10px;
    padding: 6px; position: relative;
  }
  canvas#scopeCanvas { width: 100%; height: 270px; display: block; border-radius: 6px; }
  .scope-controls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin-top: 10px; background: #0b1120; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
  }
  .ch-box { background: #111827; padding: 8px; border-radius: 8px; border-right: 4px solid var(--accent); }
  .metrics-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; text-align: center;
  }
  .metric-card { background: #060a14; border: 1px solid var(--border); padding: 6px; border-radius: 8px; }
  .metric-card span { display: block; font-size: 0.65rem; color: var(--muted); }
  .metric-card strong { font-size: 0.85rem; font-family: monospace; color: var(--green); }
</style>
</head>
<body>

<!-- Top Navigation -->
<div class="topbar">
  <div class="brand">⚡ ProSim Studio</div>
  <div class="top-actions">
    <button class="btn btn-lib" onclick="openLibrary()">📚 العناصر</button>
    <select id="demoSelect" class="btn" style="max-width:140px;" onchange="loadDemo(this.value)">
      <option value="">📂 دوائر جاهزة</option>
      <option value="psu">1. محول + قنطرة + 7805</option>
      <option value="dimmer">2. تحكم زاوية الإشعال TRIAC</option>
      <option value="bjt">3. ترانزستور BJT Switch</option>
      <option value="zener">4. منظم زينر 5.1V</option>
      <option value="motor">5. محرك DC + قياس سرعة</option>
    </select>
    <button class="btn btn-run" onclick="runSim()">▶ تشغيل</button>
    <button class="btn btn-scope" onclick="openScope()">🖥️ الأوسليسكوب</button>
  </div>
</div>

<!-- Main Drawing Board -->
<div class="workspace">
  <canvas id="board"></canvas>
  <div class="status-pill" id="statusPill">جاهز للرسم</div>

  <div class="zoom-pad">
    <button class="btn" onclick="zoomBy(1.2)" title="تكبير">+</button>
    <button class="btn" onclick="zoomBy(0.8)" title="تصغير">−</button>
    <button class="btn" onclick="resetView()" title="توسيط">⌖</button>
  </div>

  <!-- Contextual Properties Panel (Appears only when a component is tapped) -->
  <div class="prop-sheet" id="propSheet">
    <div class="prop-header">
      <span id="propTitle">خصائص العنصر</span>
      <div style="display:flex; gap:6px;">
        <button class="btn" onclick="rotateSelected()">🔄 تدوير</button>
        <button class="btn btn-danger" onclick="deleteSelected()">🗑 حذف</button>
        <button class="btn" onclick="deselectAll()">✖</button>
      </div>
    </div>
    <div id="propBody"></div>
  </div>
</div>

<!-- Bottom Quick Tools -->
<div class="bottom-bar">
  <button class="btn active" id="tool-select" onclick="setTool('select')">✋ تحريك</button>
  <button class="btn" id="tool-wire" onclick="setTool('wire')">🔌 توصيل سلك</button>
  <button class="btn" id="tool-probe" onclick="setTool('probe')">📍 مجس أوسليسكوب</button>
  <button class="btn" onclick="quickAdd('V')">🔋 مصدر</button>
  <button class="btn" onclick="quickAdd('R')">〰️ مقاومة</button>
  <button class="btn" onclick="quickAdd('C')">⏸ مكثف</button>
  <button class="btn" onclick="quickAdd('D')">▶️ دايود</button>
  <button class="btn" onclick="quickAdd('GND')">⏚ أرضي</button>
  <button class="btn" onclick="undo()">↩ تراجع</button>
  <button class="btn btn-danger" onclick="clearAll()">مسح الكل</button>
</div>

<!-- Component Library Modal -->
<div class="modal" id="libModal">
  <div class="modal-card">
    <div class="modal-head">
      <strong style="color:var(--accent);">📚 مكتبة العناصر الكهربائية والإلكترونية</strong>
      <button class="btn btn-danger" onclick="closeModal('libModal')">إغلاق</button>
    </div>
    <div class="modal-body">
      <input type="text" id="libSearch" placeholder="🔍 ابحث بالاسم أو الرقم: 1N4007, 7805, IRFZ44N, BT136, MOTOR, BRIDGE..." style="width:100%; padding:10px; border-radius:8px; background:#060a14; border:1px solid #334155; color:#fff; margin-bottom:10px;" oninput="renderLib()">
      <div class="cat-tabs" id="catTabs"></div>
      <div id="libList"></div>
    </div>
  </div>
</div>

<!-- Proteus-Style Digital Oscilloscope Modal -->
<div class="modal" id="scopeModal">
  <div class="modal-card" style="max-width:940px; border-color:var(--accent);">
    <div class="modal-head" style="background:#060a14;">
      <strong style="color:var(--green);">🖥️ Digital Oscilloscope (Proteus VSM Mode)</strong>
      <div style="display:flex; gap:6px;">
        <button class="btn active" id="modeTimeBtn" onclick="setScopeMode('time')">Time</button>
        <button class="btn" id="modeFFTBtn" onclick="setScopeMode('fft')">FFT</button>
        <button class="btn" id="modeBodeBtn" onclick="setScopeMode('bode')">Bode</button>
        <button class="btn btn-danger" onclick="closeModal('scopeModal')">✖</button>
      </div>
    </div>
    <div class="modal-body" style="background:#090d16;">
      <div class="scope-screen-wrap">
        <canvas id="scopeCanvas"></canvas>
      </div>

      <div class="metrics-strip">
        <div class="metric-card"><span>V_MAX</span><strong id="mVmax">0.00 V</strong></div>
        <div class="metric-card"><span>V_RMS</span><strong id="mVrms">0.00 V</strong></div>
        <div class="metric-card"><span>V_PP</span><strong id="mVpp">0.00 V</strong></div>
        <div class="metric-card"><span>POWER / RPM</span><strong id="mExtra">0.00 W</strong></div>
      </div>

      <!-- Oscilloscope Knobs / Sliders -->
      <div class="scope-controls">
        <div class="ch-box" style="border-color:#facc15;">
          <label style="font-size:0.75rem; color:#facc15; font-weight:bold;">CH1 (Yellow) Volts/Div: <span id="vDiv1Lbl">5V</span></label>
          <input type="range" min="1" max="50" value="5" oninput="vDiv[0]=+this.value; document.getElementById('vDiv1Lbl').innerText=this.value+'V'; drawScope();">
        </div>
        <div class="ch-box" style="border-color:#38bdf8;">
          <label style="font-size:0.75rem; color:#38bdf8; font-weight:bold;">CH2 (Blue) Volts/Div: <span id="vDiv2Lbl">5V</span></label>
          <input type="range" min="1" max="50" value="5" oninput="vDiv[1]=+this.value; document.getElementById('vDiv2Lbl').innerText=this.value+'V'; drawScope();">
        </div>
        <div class="ch-box" style="border-color:#10b981;">
          <label style="font-size:0.75rem; color:#10b981; font-weight:bold;">Timebase (Stop Time): <span id="tStopLbl">0.04s</span></label>
          <input type="range" min="0.005" max="0.2" step="0.005" value="0.04" oninput="document.getElementById('tStopLbl').innerText=this.value+'s'; tStopVal=+this.value; runSim(true);">
        </div>
        <div class="ch-box" style="border-color:#ec4899;">
          <label style="font-size:0.75rem; color:#ec4899; font-weight:bold;">Live Source / Angle: <span id="liveTuneLbl">--</span></label>
          <input type="range" min="1" max="180" value="60" oninput="liveTuneScope(+this.value)">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const LIBRARY = [
  { cat: 'المصادر والحماية', name: 'DC Source (بطارية / جهد مستمر)', type: 'V', part: 'DC-12V', dc: 12, amp: 0, freq: 0, wave: 'sine' },
  { cat: 'المصادر والحماية', name: 'AC Mains 220V RMS 50Hz', type: 'V', part: 'AC-220V', dc: 0, amp: 311, freq: 50, wave: 'sine' },
  { cat: 'المصادر والحماية', name: 'Pulse / Square Generator', type: 'V', part: 'PULSE-5V', dc: 0, amp: 5, freq: 100, wave: 'square' },
  { cat: 'المصادر والحماية', name: 'Ground (أرضي 0V)', type: 'GND', part: 'GND' },
  { cat: 'المصادر والحماية', name: 'Switch (مفتاح يدوي)', type: 'SW', part: 'SW-SPST', closed: true },
  { cat: 'المصادر والحماية', name: 'Fuse 5A (فيوز حماية)', type: 'FUSE', part: 'FUSE-5A', val: 0.01 },

  { cat: 'المقاومات والمكثفات', name: 'Resistor (مقاومة ثابتة)', type: 'R', part: 'RES', val: '1k' },
  { cat: 'المقاومات والمكثفات', name: 'Potentiometer (مقاومة متغيرة)', type: 'POT', part: 'POT-10K', val: '10k', pct: 50 },
  { cat: 'المقاومات والمكثفات', name: 'Capacitor (مكثف سيراميك)', type: 'C', part: 'CAP', val: '100n' },
  { cat: 'المقاومات والمكثفات', name: 'Electrolytic Cap (مكثف كيميائي)', type: 'CELEC', part: '470uF', val: '470u' },
  { cat: 'المقاومات والمكثفات', name: 'Inductor (ملف حث)', type: 'L', part: 'IND', val: '10m' },
  { cat: 'المقاومات والمكثفات', name: 'Transformer 220V->12V (محول)', type: 'TRF', part: 'TRAN-2P2S', val: 0.055 },

  { cat: 'الدايودات والليد', name: '1N4007 (دايود تقويم 1000V)', type: 'D', part: '1N4007' },
  { cat: 'الدايودات والليد', name: '1N4148 (دايود سريع)', type: 'D', part: '1N4148' },
  { cat: 'الدايودات والليد', name: '1N5819 (دايود شوتكي 0.25V)', type: 'D', part: '1N5819' },
  { cat: 'الدايودات والليد', name: 'Bridge Rectifier (قنطرة توحيد)', type: 'BRIDGE', part: 'KBP206' },
  { cat: 'الدايودات والليد', name: '1N4733A (زينر 5.1V)', type: 'Z', part: '1N4733A', val: 5.1 },
  { cat: 'الدايودات والليد', name: '1N4742A (زينر 12V)', type: 'Z', part: '1N4742A', val: 12.0 },
  { cat: 'الدايودات والليد', name: 'LED Red (ليد أحمر مضيء)', type: 'LED', part: 'LED-RED' },
  { cat: 'الدايودات والليد', name: 'LED Green (ليد أخضر مضيء)', type: 'LED', part: 'LED-GREEN' },

  { cat: 'الترانزستورات والقوى', name: '2N2222 (ترانزستور NPN)', type: 'Q', part: '2N2222', pol: 'NPN', val: 200 },
  { cat: 'الترانزستورات والقوى', name: 'BC547 (ترانزستور NPN)', type: 'Q', part: 'BC547', pol: 'NPN', val: 300 },
  { cat: 'الترانزستورات والقوى', name: '2N2907 (ترانزستور PNP)', type: 'Q', part: '2N2907', pol: 'PNP', val: 200 },
  { cat: 'الترانزستورات والقوى', name: 'IRFZ44N (موسفت N-MOSFET)', type: 'M', part: 'IRFZ44N', pol: 'N', val: 2.5 },
  { cat: 'الترانزستورات والقوى', name: 'IRF9540N (موسفت P-MOSFET)', type: 'M', part: 'IRF9540N', pol: 'P', val: 3.0 },
  { cat: 'الترانزستورات والقوى', name: 'BT136 (ترياك TRIAC 600V)', type: 'TRIAC', part: 'BT136' },
  { cat: 'الترانزستورات والقوى', name: 'BT151 (ثايرستور SCR)', type: 'SCR', part: 'BT151' },
  { cat: 'الترانزستورات والقوى', name: 'DB3 (داياك DIAC 32V)', type: 'DIAC', part: 'DB3', val: 32 },
  { cat: 'الترانزستورات والقوى', name: 'Gate Firing Controller (قدح زاوية)', type: 'GATE_FIRING', part: 'ALPHA-CTRL', alpha: 60, freq: 50 },

  { cat: 'المتكاملات والمحركات', name: '7805 (+5V منظم جهد)', type: 'REG', part: '7805', val: 5.0 },
  { cat: 'المتكاملات والمحركات', name: '7812 (+12V منظم جهد)', type: 'REG', part: '7812', val: 12.0 },
  { cat: 'المتكاملات والمحركات', name: 'LM741 (مكبر عمليات Op-Amp)', type: 'OP', part: 'LM741' },
  { cat: 'المتكاملات والمحركات', name: 'NE555 (مؤقت 555)', type: 'NE555', part: 'NE555', val: 5.0 },
  { cat: 'المتكاملات والمحركات', name: 'Arduino / MCU (متحكم مبرمج)', type: 'MCU', part: 'ATmega328P', code: 'if A0 > 2.5:\n    digitalWrite(HIGH)\nelse:\n    digitalWrite(LOW)' },
  { cat: 'المتكاملات والمحركات', name: 'DC Motor 12V (محرك تيار مستمر)', type: 'MOTOR', part: 'DC-MOTOR', load: 0 },
  { cat: 'المتكاملات والمحركات', name: 'Stepper Motor (محرك خطوي)', type: 'MOTOR', part: 'STEPPER-MOTOR', load: 0 },
  { cat: 'المتكاملات والمحركات', name: 'BLDC Motor (محرك بدون فرش)', type: 'MOTOR', part: 'BLDC-MOTOR', load: 0 },
  { cat: 'المتكاملات والمحركات', name: 'Ammeter (أميتر قياس تيار)', type: 'AMMETER', part: 'AMMETER' },
  { cat: 'المتكاملات والمحركات', name: 'Wattmeter (قياس قدرة و PF)', type: 'WATTMETER', part: 'WATTMETER' }
];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let view = { x: 0, y: 0, scale: 1 };
let tool = 'select';
let components = [];
let wires = [];
let probes = [];
let history = [];
let nextId = 1;
let selected = null;
let dragging = null;
let panning = false;
let panStart = { x: 0, y: 0 };
let wireStart = null;
let pointerWorld = { x: 0, y: 0 };
let tStopVal = 0.04;

// Simulation results
let simData = null;
let nodeVoltagesLast = {};
let ledCurrents = {};
let motorStats = {};
let ammeterStats = {};
let scopeMode = 'time';
let vDiv = [5, 5, 5, 5];

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

function screenToWorld(sx, sy) {
  return {
    x: (sx - view.x) / view.scale,
    y: (sy - view.y) / view.scale
  };
}

function zoomBy(factor) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  view.x = cx - (cx - view.x) * factor;
  view.y = cy - (cy - view.y) * factor;
  view.scale = Math.max(0.4, Math.min(2.5, view.scale * factor));
  draw();
}

function resetView() {
  view = { x: 0, y: 0, scale: 1 };
  draw();
}

function saveUndo() {
  history.push(JSON.stringify({ components, wires, probes, nextId }));
  if (history.length > 25) history.shift();
}

function undo() {
  if (!history.length) return;
  const s = JSON.parse(history.pop());
  components = s.components; wires = s.wires; probes = s.probes; nextId = s.nextId;
  deselectAll();
  draw();
}

function setTool(t) {
  tool = t;
  wireStart = null;
  document.querySelectorAll('.bottom-bar .btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tool-' + t);
  if (el) el.classList.add('active');
  setStatus(t === 'wire' ? 'اضغط على طرف عنصر ثم الطرف الآخر لتوصيل سلك' : (t === 'probe' ? 'اضغط على أي طرف لوضع مجس أوسليسكوب' : 'جاهز'));
  draw();
}

function setStatus(msg, isErr = false) {
  const el = document.getElementById('statusPill');
  el.innerText = msg;
  el.style.color = isErr ? '#f87171' : '#10b981';
}

function getPins(c) {
  let raw = [];
  if (c.type === 'GND') raw = [{ x: c.x, y: c.y - 20 }];
  else if (c.type === 'REG') raw = [{ x: c.x - 40, y: c.y }, { x: c.x, y: c.y + 30 }, { x: c.x + 40, y: c.y }];
  else if (c.type === 'OP') raw = [{ x: c.x - 40, y: c.y - 12 }, { x: c.x - 40, y: c.y + 12 }, { x: c.x + 40, y: c.y }];
  else if (['Q', 'M', 'SCR', 'TRIAC'].includes(c.type)) raw = [{ x: c.x - 40, y: c.y }, { x: c.x + 20, y: c.y - 35 }, { x: c.x + 20, y: c.y + 35 }];
  else if (['TRF', 'BRIDGE', 'WATTMETER', 'NE555'].includes(c.type)) raw = [{ x: c.x - 40, y: c.y - 16 }, { x: c.x - 40, y: c.y + 16 }, { x: c.x + 40, y: c.y - 16 }, { x: c.x + 40, y: c.y + 16 }];
  else raw = [{ x: c.x - 40, y: c.y }, { x: c.x + 40, y: c.y }];

  const rad = ((c.rot || 0) * Math.PI) / 180;
  return raw.map(p => {
    const dx = p.x - c.x, dy = p.y - c.y;
    return {
      x: Math.round(c.x + dx * Math.cos(rad) - dy * Math.sin(rad)),
      y: Math.round(c.y + dx * Math.sin(rad) + dy * Math.cos(rad))
    };
  });
}

function findPinNear(wx, wy) {
  let best = null, bestDist = 22 / view.scale;
  for (const c of components) {
    const pins = getPins(c);
    pins.forEach((p, idx) => {
      const d = Math.hypot(p.x - wx, p.y - wy);
      if (d < bestDist) { bestDist = d; best = { compId: c.id, pinIdx: idx, x: p.x, y: p.y }; }
    });
  }
  return best;
}

function findCompNear(wx, wy) {
  for (let i = components.length - 1; i >= 0; i--) {
    const c = components[i];
    if (Math.hypot(c.x - wx, c.y - wy) < 38) return c;
  }
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const w = screenToWorld(sx, sy);
  pointerWorld = w;

  if (tool === 'wire') {
    const pin = findPinNear(w.x, w.y);
    if (pin) {
      if (!wireStart) {
        wireStart = pin;
        setStatus('اختر الطرف الثاني لإكمال التوصيل...');
      } else if (wireStart.compId !== pin.compId || wireStart.pinIdx !== pin.pinIdx) {
        saveUndo();
        wires.push({ from: { compId: wireStart.compId, pinIdx: wireStart.pinIdx }, to: { compId: pin.compId, pinIdx: pin.pinIdx } });
        wireStart = null;
        setStatus('✅ تم توصيل السلك');
      }
    } else {
      wireStart = null;
    }
    draw();
    return;
  }

  if (tool === 'probe') {
    const pin = findPinNear(w.x, w.y);
    if (pin) {
      saveUndo();
      const idx = probes.findIndex(p => p.compId === pin.compId && p.pinIdx === pin.pinIdx);
      if (idx >= 0) probes.splice(idx, 1);
      else {
        const colors = ['#facc15', '#38bdf8', '#10b981', '#ec4899'];
        probes.push({ compId: pin.compId, pinIdx: pin.pinIdx, label: `CH${probes.length + 1}`, color: colors[probes.length % 4] });
      }
      if (components.length) runSim(true);
    }
    draw();
    return;
  }

  const comp = findCompNear(w.x, w.y);
  if (comp) {
    if (comp.type === 'SW') {
      comp.closed = !comp.closed;
      runSim(true);
    }
    selectComponent(comp);
    dragging = comp;
  } else {
    deselectAll();
    panning = true;
    panStart = { x: sx - view.x, y: sy - view.y };
  }
  draw();
});

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  pointerWorld = screenToWorld(sx, sy);

  if (dragging) {
    dragging.x = Math.round(pointerWorld.x / 20) * 20;
    dragging.y = Math.round(pointerWorld.y / 20) * 20;
    draw();
  } else if (panning) {
    view.x = sx - panStart.x;
    view.y = sy - panStart.y;
    draw();
  } else if (wireStart) {
    draw();
  }
});

canvas.addEventListener('pointerup', () => { dragging = null; panning = false; });
canvas.addEventListener('pointercancel', () => { dragging = null; panning = false; });

function quickAdd(type) {
  const item = LIBRARY.find(x => x.type === type);
  if (item) addComponentFromLib(item);
}

function addComponentFromLib(item) {
  saveUndo();
  const center = screenToWorld(canvas.width / 2, canvas.height / 2);
  const comp = {
    id: nextId++,
    type: item.type,
    part: item.part || item.type,
    x: Math.round((center.x + (Math.random() - 0.5) * 80) / 20) * 20,
    y: Math.round((center.y + (Math.random() - 0.5) * 80) / 20) * 20,
    rot: 0,
    val: item.val !== undefined ? item.val : 0,
    dc: item.dc || 0,
    amp: item.amp || 0,
    freq: item.freq || 0,
    wave: item.wave || 'sine',
    pol: item.pol || 'NPN',
    pct: item.pct || 50,
    alpha: item.alpha || 60,
    load: item.load || 0,
    closed: item.closed !== undefined ? item.closed : true,
    code: item.code || ''
  };
  components.push(comp);
  selectComponent(comp);
  setTool('select');
  draw();
}

function selectComponent(c) {
  selected = c;
  const sheet = document.getElementById('propSheet');
  const body = document.getElementById('propBody');
  document.getElementById('propTitle').innerText = `${c.part} (#${c.id})`;

  let html = '';
  if (c.type === 'V') {
    html = `<div class="prop-grid">
      <div><label>النوع (Wave)</label><select onchange="selected.wave=this.value; runSim(true);">
        <option value="sine" ${c.wave==='sine'?'selected':''}>Sine / DC</option>
        <option value="square" ${c.wave==='square'?'selected':''}>Square</option>
        <option value="pulse" ${c.wave==='pulse'?'selected':''}>Pulse</option>
      </select></div>
      <div><label>DC Offset (V)</label><input type="number" step="any" value="${c.dc}" onchange="selected.dc=+this.value; draw(); runSim(true);"></div>
      <div><label>Amplitude (V)</label><input type="number" step="any" value="${c.amp}" onchange="selected.amp=+this.value; draw(); runSim(true);"></div>
      <div><label>Freq (Hz)</label><input type="number" step="any" value="${c.freq}" onchange="selected.freq=+this.value; draw(); runSim(true);"></div>
    </div>`;
  } else if (c.type === 'POT') {
    html = `<div class="prop-grid">
      <div><label>المقاومة الكلية</label><input type="text" value="${c.val}" onchange="selected.val=this.value; runSim(true);"></div>
      <div><label>النسبة: <b id="potV">${c.pct}%</b></label><input type="range" min="1" max="100" value="${c.pct}" oninput="selected.pct=+this.value; document.getElementById('potV').innerText=this.value+'%'; runSim(true);"></div>
    </div>`;
  } else if (c.type === 'GATE_FIRING') {
    html = `<div><label>🔥 زاوية الإشعال α: <b id="alpV">${c.alpha}°</b></label>
      <input type="range" min="0" max="175" value="${c.alpha}" oninput="selected.alpha=+this.value; document.getElementById('alpV').innerText=this.value+'°'; runSim(true);"></div>`;
  } else if (c.type === 'MCU') {
    html = `<div><label>كود المتحكم (Python أو Arduino C++):</label>
      <textarea rows="3" onchange="selected.code=this.value">${c.code}</textarea></div>`;
  } else if (['R', 'C', 'CELEC', 'L', 'Z', 'TRF'].includes(c.type)) {
    html = `<div><label>القيمة الهندسية (مثال: 10k, 4k7, 100n, 470u)</label>
      <input type="text" value="${c.val}" onchange="selected.val=this.value; draw(); runSim(true);"></div>`;
  } else {
    html = `<div style="font-size:0.78rem; color:var(--muted);">العنصر جاهز للتوصيل والمحاكاة.</div>`;
  }
  body.innerHTML = html;
  sheet.style.display = 'block';
}

function deselectAll() {
  selected = null;
  document.getElementById('propSheet').style.display = 'none';
}

function rotateSelected() {
  if (!selected) return;
  saveUndo();
  selected.rot = ((selected.rot || 0) + 90) % 360;
  draw();
}

function deleteSelected() {
  if (!selected) return;
  saveUndo();
  wires = wires.filter(w => w.from.compId !== selected.id && w.to.compId !== selected.id);
  probes = probes.filter(p => p.compId !== selected.id);
  components = components.filter(c => c.id !== selected.id);
  deselectAll();
  draw();
}

function clearAll() {
  saveUndo();
  components = []; wires = []; probes = []; simData = null; nodeVoltagesLast = {};
  deselectAll();
  setStatus('تم مسح البوردة');
  draw();
}

/* Drawing Schematic Cleanly */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.scale, view.scale);

  // Subtle Grid
  ctx.fillStyle = '#1e293b';
  for (let x = -400; x < 1600; x += 20) {
    for (let y = -400; y < 1200; y += 20) {
      ctx.fillRect(x, y, 1.5, 1.5);
    }
  }

  const net = simData ? buildNetlist() : null;

  // Draw Orthogonal Wires + Live Voltage Badges
  wires.forEach(w => {
    const c1 = components.find(c => c.id === w.from.compId);
    const c2 = components.find(c => c.id === w.to.compId);
    if (!c1 || !c2) return;
    const p1 = getPins(c1)[w.from.pinIdx];
    const p2 = getPins(c2)[w.to.pinIdx];
    const nodeId = net ? net.getNode(w.from.compId, w.from.pinIdx) : null;
    const vVal = nodeId !== null ? (nodeVoltagesLast[nodeId] || 0) : null;

    ctx.strokeStyle = vVal === null ? '#10b981' : (nodeId === 0 ? '#3b82f6' : (Math.abs(vVal) > 8 ? '#ef4444' : '#f59e0b'));
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    // Live Proteus Voltage Tag on Wire
    if (vVal !== null && nodeId !== 0) {
      const mx = (p1.x + p2.x) / 2, my = p1.y - 6;
      ctx.fillStyle = 'rgba(15,23,42,0.9)';
      ctx.fillRect(mx - 22, my - 11, 44, 14);
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${vVal.toFixed(2)}V`, mx, my - 1);
    }
  });

  // Active Wire Preview
  if (wireStart) {
    ctx.strokeStyle = '#facc15';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(wireStart.x, wireStart.y);
    ctx.lineTo(pointerWorld.x, wireStart.y);
    ctx.lineTo(pointerWorld.x, pointerWorld.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw Components
  components.forEach(c => {
    drawComponent(c);
    getPins(c).forEach(p => {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4.2, 0, Math.PI * 2);
      ctx.fill();
    });
  });

  // Draw Scope Probes
  probes.forEach(pr => {
    const c = components.find(x => x.id === pr.compId);
    if (!c) return;
    const p = getPins(c)[pr.pinIdx];
    ctx.fillStyle = pr.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - 12, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pr.label, p.x, p.y - 21);
  });

  ctx.restore();
}

function drawComponent(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(((c.rot || 0) * Math.PI) / 180);
  const isSel = selected && selected.id === c.id;
  ctx.strokeStyle = isSel ? '#facc15' : '#38bdf8';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 2.2;

  if (c.type === 'GND') {
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(0, 0);
    ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
    ctx.moveTo(-9, 5); ctx.lineTo(9, 5);
    ctx.moveTo(-4, 10); ctx.lineTo(4, 10);
    ctx.stroke();
  } else if (c.type === 'R' || c.type === 'POT' || c.type === 'FUSE') {
    ctx.beginPath();
    ctx.moveTo(-40, 0); ctx.lineTo(-22, 0);
    ctx.lineTo(-18, -8); ctx.lineTo(-10, 8); ctx.lineTo(-2, -8);
    ctx.lineTo(6, 8); ctx.lineTo(14, -8); ctx.lineTo(22, 0);
    ctx.lineTo(40, 0);
    ctx.stroke();
  } else if (c.type === 'C' || c.type === 'CELEC') {
    ctx.beginPath();
    ctx.moveTo(-40, 0); ctx.lineTo(-5, 0);
    ctx.moveTo(-5, -14); ctx.lineTo(-5, 14);
    ctx.moveTo(5, -14); ctx.lineTo(5, 14);
    ctx.moveTo(5, 0); ctx.lineTo(40, 0);
    ctx.stroke();
  } else if (c.type === 'D' || c.type === 'Z' || c.type === 'LED') {
    ctx.beginPath();
    ctx.moveTo(-40, 0); ctx.lineTo(-12, 0);
    ctx.moveTo(12, 0); ctx.lineTo(40, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-12, -12); ctx.lineTo(12, 0); ctx.lineTo(-12, 12); ctx.closePath();
    if (c.type === 'LED' && (ledCurrents[c.id] || 0) > 0.001) {
      ctx.fillStyle = '#ef4444'; ctx.fill();
    }
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -12); ctx.lineTo(12, 12); ctx.stroke();
  } else if (c.type === 'V') {
    ctx.beginPath();
    ctx.moveTo(-40, 0); ctx.lineTo(-18, 0);
    ctx.moveTo(18, 0); ctx.lineTo(40, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fillStyle = '#0b1120'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(c.freq > 0 ? '~' : 'DC', 0, 4);
  } else if (c.type === 'MOTOR') {
    ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-20, 0); ctx.moveTo(20, 0); ctx.lineTo(40, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fillStyle = '#0b1120'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#10b981'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.fillText('M', 0, 4);
  } else {
    // Clean IC / Block representation with explicit pins
    ctx.fillStyle = '#111827';
    ctx.fillRect(-26, -22, 52, 44);
    ctx.strokeRect(-26, -22, 52, 44);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(c.type, 0, 4);
  }
  ctx.restore();

  if (c.type !== 'GND') {
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    let sub = c.part;
    if (['R', 'C', 'CELEC', 'L'].includes(c.type)) sub = `${c.val}`;
    if (c.type === 'V') sub = c.freq > 0 ? `${c.amp}V ${c.freq}Hz` : `${c.dc}V DC`;
    if (c.type === 'MOTOR' && motorStats[c.id]) sub = `${Math.abs(motorStats[c.id].rpm).toFixed(0)} RPM`;
    if (c.type === 'AMMETER' && ammeterStats[c.id] !== undefined) sub = `${(ammeterStats[c.id]*1000).toFixed(1)}mA`;
    ctx.fillText(sub, c.x, c.y + 34);
  }
}

/* Netlist & Backend Simulation */
function buildNetlist() {
  const parent = {};
  const k = (cid, pid) => `${cid}_${pid}`;
  components.forEach(c => getPins(c).forEach((_, i) => parent[k(c.id, i)] = k(c.id, i)));
  const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  wires.forEach(w => union(k(w.from.compId, w.from.pinIdx), k(w.to.compId, w.to.pinIdx)));

  const gnds = new Set(components.filter(c => c.type === 'GND').map(g => find(k(g.id, 0))));
  const map = {};
  let idx = 1;
  Object.keys(parent).forEach(key => {
    const r = find(key);
    if (gnds.has(r)) map[r] = 0;
    else if (!(r in map)) map[r] = idx++;
  });
  const getNode = (cid, pid) => map[find(k(cid, pid))] ?? 0;

  const netComps = components.filter(c => c.type !== 'GND').map(c => ({
    id: c.id, type: c.type, part: c.part,
    pins: getPins(c).map((_, i) => getNode(c.id, i)),
    val: c.val, dc: c.dc, amp: c.amp, freq: c.freq, wave: c.wave,
    pol: c.pol, pct: c.pct, alpha: c.alpha, load: c.load, closed: c.closed, code: c.code
  }));

  const probeMap = probes.map(p => ({ label: p.label, color: p.color, node: getNode(p.compId, p.pinIdx) }));
  return { num_nodes: idx - 1, components: netComps, probeMap, getNode };
}

async function runSim(silent = false) {
  if (!components.length) { setStatus('البوردة فارغة', true); return; }
  if (!components.some(c => c.type === 'GND')) { setStatus('أضف أرضي (GND) أولاً', true); return; }

  const net = buildNetlist();
  if (!silent) setStatus('⏳ جاري المحاكاة...');

  const res = await fetch('/simulate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      mode: scopeMode === 'bode' ? 'bode' : 'transient',
      num_nodes: net.num_nodes,
      t_stop: tStopVal,
      components: net.components
    })
  });
  const data = await res.json();
  if (data.status === 'error') { setStatus('❌ ' + data.message, true); return; }

  simData = { data, net };
  if (data.voltages) {
    nodeVoltagesLast = { 0: 0 };
    data.voltages.forEach((arr, i) => nodeVoltagesLast[i + 1] = arr[arr.length - 1] || 0);
  }
  ledCurrents = data.leds || {};
  motorStats = data.motors || {};
  ammeterStats = data.ammeters || {};

  setStatus('✅ تم التشغيل بدقة SPICE');
  draw();
  if (document.getElementById('scopeModal').style.display === 'flex') drawScope();
}

/* Authentic Proteus Digital Oscilloscope */
function openScope() {
  document.getElementById('scopeModal').style.display = 'flex';
  if (!simData) runSim(true);
  else drawScope();
}

function setScopeMode(m) {
  scopeMode = m;
  ['time', 'fft', 'bode'].forEach(x => {
    document.getElementById('mode' + x.charAt(0).toUpperCase() + x.slice(1) + 'Btn').classList.toggle('active', x === m);
  });
  runSim(true);
}

function liveTuneScope(val) {
  document.getElementById('liveTuneLbl').innerText = val;
  const gf = components.find(c => c.type === 'GATE_FIRING');
  const pot = components.find(c => c.type === 'POT');
  const vSrc = components.find(c => c.type === 'V');
  if (gf) gf.alpha = val;
  else if (pot) pot.pct = Math.min(100, val);
  else if (vSrc) {
    if (vSrc.freq > 0) vSrc.amp = val;
    else vSrc.dc = val;
  }
  runSim(true);
}

function drawScope() {
  const sc = document.getElementById('scopeCanvas');
  sc.width = sc.parentElement.clientWidth - 12;
  sc.height = 270;
  const sctx = sc.getContext('2d');

  // CRT Phosphor Dark Background + 10x8 Divisions Grid
  sctx.fillStyle = '#030b06';
  sctx.fillRect(0, 0, sc.width, sc.height);
  const cols = 10, rows = 8;
  const dx = sc.width / cols, dy = sc.height / rows;

  sctx.strokeStyle = '#0f291a';
  sctx.lineWidth = 1;
  for (let i = 1; i < cols; i++) { sctx.beginPath(); sctx.moveTo(i * dx, 0); sctx.lineTo(i * dx, sc.height); sctx.stroke(); }
  for (let j = 1; j < rows; j++) { sctx.beginPath(); sctx.moveTo(0, j * dy); sctx.lineTo(sc.width, j * dy); sctx.stroke(); }

  // Center Crosshairs (0V Axis)
  sctx.strokeStyle = '#1e4d32';
  sctx.lineWidth = 1.5;
  sctx.beginPath(); sctx.moveTo(0, sc.height / 2); sctx.lineTo(sc.width, sc.height / 2); sctx.stroke();
  sctx.beginPath(); sctx.moveTo(sc.width / 2, 0); sctx.lineTo(sc.width / 2, sc.height); sctx.stroke();

  if (!simData || !simData.data) return;
  const d = simData.data;
  const net = simData.net;

  if (scopeMode === 'bode' && d.freqs) {
    const arr = d.mags[0] || [];
    sctx.strokeStyle = '#a855f7'; sctx.lineWidth = 2.5; sctx.beginPath();
    arr.forEach((db, idx) => {
      const px = (idx / Math.max(1, arr.length - 1)) * sc.width;
      const py = sc.height / 2 - (db / 40) * (sc.height / 2);
      idx === 0 ? sctx.moveTo(px, py) : sctx.lineTo(px, py);
    });
    sctx.stroke();
    return;
  }

  if (scopeMode === 'fft' && d.fft_mags) {
    const mags = d.fft_mags[0] || [];
    const maxM = Math.max(0.1, ...mags);
    sctx.fillStyle = '#ec4899';
    const bw = sc.width / Math.max(1, mags.length);
    mags.forEach((m, i) => {
      const h = (m / maxM) * (sc.height - 20);
      sctx.fillRect(i * bw, sc.height - h, Math.max(2, bw - 2), h);
    });
    return;
  }

  // Time Domain Channels
  const channels = net.probeMap.length > 0
    ? net.probeMap.map(p => ({ label: p.label, color: p.color, data: p.node === 0 ? d.times.map(() => 0) : (d.voltages[p.node - 1] || []) }))
    : d.voltages.slice(0, 4).map((arr, i) => ({ label: `CH${i+1}`, color: ['#facc15', '#38bdf8', '#10b981', '#ec4899'][i], data: arr }));

  channels.forEach((ch, idx) => {
    if (!ch.data.length) return;
    const scaleY = dy / (vDiv[idx] || 5);
    sctx.strokeStyle = ch.color;
    sctx.lineWidth = 2.2;
    sctx.beginPath();
    ch.data.forEach((v, i) => {
      const px = (i / Math.max(1, ch.data.length - 1)) * sc.width;
      const py = sc.height / 2 - v * scaleY;
      i === 0 ? sctx.moveTo(px, py) : sctx.lineTo(px, py);
    });
    sctx.stroke();

    // Channel Label on CRT
    sctx.fillStyle = ch.color;
    sctx.font = 'bold 11px monospace';
    sctx.fillText(`${ch.label}: ${vDiv[idx] || 5}V/div`, 10 + idx * 115, 16);
  });

  // Update Digital Metrics
  const mainSig = channels[channels.length - 1]?.data || [];
  if (mainSig.length) {
    const vmax = Math.max(...mainSig), vmin = Math.min(...mainSig);
    const vrms = Math.sqrt(mainSig.reduce((a, b) => a + b * b, 0) / mainSig.length);
    document.getElementById('mVmax').innerText = vmax.toFixed(2) + ' V';
    document.getElementById('mVrms').innerText = vrms.toFixed(2) + ' V';
    document.getElementById('mVpp').innerText = (vmax - vmin).toFixed(2) + ' V';
    const mKeys = Object.keys(motorStats);
    if (mKeys.length) {
      document.getElementById('mExtra').innerText = Math.abs(motorStats[mKeys[0]].rpm).toFixed(0) + ' RPM';
    } else {
      const pwr = Object.values(d.powers || {}).reduce((a, b) => a + b, 0);
      document.getElementById('mExtra').innerText = pwr.toFixed(2) + ' W';
    }
  }
}
